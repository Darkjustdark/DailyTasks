<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#050914">
<meta name="mobile-web-app-capable" content="yes">
<title>DopaminApp</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="heading">
      <h1 id="title">Today</h1>
      <div id="subtitle" class="subtitle"></div>
    </div>
    <div class="actions">
      <button id="btnHistory" class="icon-btn" aria-label="History">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      </button>
      <button id="btnEdit" class="icon-btn" aria-label="Editor mode">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>
      </button>
      <div id="xpBadge" class="xp-badge" aria-label="XP balance">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z" fill="currentColor"/></svg>
        <span id="xpValue">0</span><span class="xp-unit">XP</span>
      </div>
    </div>
  </header>

  <main id="view"></main>

  <nav class="tabbar">
    <button class="tab active" data-tab="daily">
      <span class="ico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
      <span>Daily</span>
    </button>
    <button class="tab" data-tab="weekly">
      <span class="ico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4M7 15h10"/></svg></span>
      <span>Weekly</span>
    </button>
    <button class="tab" data-tab="monthly">
      <span class="ico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M7.5 14h.01M12 14h.01M16.5 14h.01M7.5 17.5h.01M12 17.5h.01"/></svg></span>
      <span>Monthly</span>
    </button>
    <button class="tab" data-tab="shop">
      <span class="ico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg></span>
      <span>Shop</span>
    </button>
  </nav>

  <section id="history" class="history" aria-hidden="true"></section>
  <div id="sheet" class="sheet hidden"></div>
  <div id="toast" class="toast"></div>
  <div id="fx" class="fx"></div>
  <input id="importFile" type="file" accept="application/json,.json" hidden>

  <script src="app.js"></script>
</body>
</html>
